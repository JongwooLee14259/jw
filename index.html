<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>계획과 과제 수행 실험</title>
<style>
  :root { --fg:#1d1d1f; --muted:#6b6b70; --line:#e3e3e6; --bg:#fafafa; --a:#2563eb; --b:#c2410c; --ok:#15803d; --warn:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; }
  #app { max-width:640px; margin:0 auto; padding:28px 20px 60px; }
  h1 { font-size:24px; margin:8px 0 16px; } h2 { font-size:20px; margin:8px 0 12px; } h3 { font-size:16px; margin:0 0 6px; }
  p { margin:8px 0; } ul { padding-left:20px; }
  button { font:inherit; padding:10px 18px; border-radius:8px; border:1px solid var(--fg); background:var(--fg); color:#fff; cursor:pointer; margin:6px 6px 6px 0; }
  button:disabled { opacity:.35; cursor:default; }
  button.ghost { background:#fff; color:var(--fg); border-color:var(--line); }
  button.small, .small { font-size:13px; }
  .small { color:var(--muted); }
  .warn { color:var(--warn); }
  .hidden { display:none !important; }
  .check, .opt { display:block; margin:10px 0; cursor:pointer; }
  .nav { margin-top:20px; }
  .plan { display:inline-block; margin:8px 0 12px; padding:8px 14px; border:1px solid var(--line); border-radius:8px; background:#fff; }
  .ex { margin:8px 0; padding:8px 12px; background:#fff; border:1px solid var(--line); border-radius:8px; }
  .ta { color:var(--a); font-weight:600; margin-right:8px; } .tb { color:var(--b); font-weight:600; margin-right:8px; }
  table.score { border-collapse:collapse; margin:8px 0; background:#fff; }
  table.score td { border:1px solid var(--line); padding:6px 12px; }
  .bar { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--line); color:var(--muted); font-size:14px; }
  .bar b { color:var(--fg); font-variant-numeric:tabular-nums; }
  .sub { min-height:28px; margin:8px 0; color:var(--muted); font-size:14px; }
  .task-label { margin-top:24px; font-size:14px; }
  .prompt { font-size:30px; letter-spacing:.04em; margin:12px 0 18px; font-variant-numeric:tabular-nums; }
  .answer-row { display:flex; gap:8px; align-items:center; }
  .answer-row input, .est input { font:inherit; font-size:22px; width:120px; padding:8px 10px; border:1px solid #bbb; border-radius:8px; text-transform:uppercase; }
  .fb { min-height:24px; margin-top:8px; color:var(--muted); }
  .fb.bad { color:var(--warn); }
  .keypad { display:grid; grid-template-columns:repeat(3, 1fr); gap:8px; max-width:340px; margin-top:8px; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  .keypad button { margin:0; height:60px; font-size:24px; background:#fff; color:var(--fg); border:1px solid #c9c9cf; border-radius:10px; }
  .keypad button:active { background:#ececf0; }
  .keypad .kdel { font-size:16px; } .keypad .kok { background:var(--fg); color:#fff; font-size:18px; }
  @media (max-width:600px) { #app { padding:16px 14px 40px; } .prompt { font-size:26px; margin:8px 0 12px; } .task-label { margin-top:12px; } .keypad { max-width:none; } }
  .steps li { margin:6px 0; }
  .summary { padding:12px 16px; background:#fff; border:1px solid var(--line); border-radius:8px; }
  .summary p { margin:4px 0; }
  .signal { margin-top:24px; padding:20px; background:#fff; border:1px solid var(--line); border-radius:12px; }
  .signal .big, .big { font-size:22px; }
  .choices button { min-width:150px; }
  .est { margin:12px 0; }
  .toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:var(--ok); color:#fff; padding:10px 16px; border-radius:8px; opacity:0; transition:opacity .2s; pointer-events:none; }
  .toast.show { opacity:1; }
  .overlay { position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center; justify-content:center; }
  .overlay .card { background:#fff; padding:20px 24px; border-radius:12px; min-width:280px; }
  .q { margin:16px 0; padding:12px 14px; background:#fff; border:1px solid var(--line); border-radius:8px; }
  .likert { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .likert small { color:var(--muted); }
  .lk { display:flex; flex-direction:column; align-items:center; font-size:13px; cursor:pointer; }
  textarea { width:100%; font:inherit; padding:8px; border:1px solid #bbb; border-radius:8px; }
  .debrief { margin:16px 0; padding:12px 14px; background:#fff; border:1px solid var(--line); border-radius:8px; }
  .code { font-family:ui-monospace, Menlo, monospace; }
  .prize { padding:8px 12px; background:#fff7e6; border:1px solid #f3d9a4; border-radius:8px; }
  .prizebox { margin:20px 0; padding:14px 16px; background:#fff; border:1px solid var(--line); border-radius:10px; }
  .prizebox .notice { white-space:pre-wrap; font:inherit; font-size:14px; color:var(--muted); background:var(--bg); padding:10px 12px; border-radius:8px; margin:8px 0; }
  .prizebox input[type=tel] { font:inherit; font-size:18px; padding:8px 10px; border:1px solid #bbb; border-radius:8px; width:200px; margin-right:6px; }
</style>
</head>
<body>
<div id="app">불러오는 중…</div>
<script src="config.js"></script>
<script src="problems.js"></script>
<script src="experiment.js"></script>
</body>
</html>
